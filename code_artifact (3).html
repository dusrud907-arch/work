        function initMap() {
            // Busan City Hall center
            map = L.map('map', {
                center: [35.179558, 129.075642],
                zoom: 12,
                zoomControl: false
            });

            // High Resolution Google Maps Layer
            const googleTileLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=ko', {
                maxZoom: 19,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            });

            // VWorld Fallback Layer
            const vworldTileLayer = L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; VWorld'
            });

            googleTileLayer.on('tileerror', function() {
                if (map.hasLayer(googleTileLayer)) {
                    map.removeLayer(googleTileLayer);
                    vworldTileLayer.addTo(map);
                }
            });

            googleTileLayer.addTo(map);

            // Zoom control
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Marker cluster setup
            if (typeof L.markerClusterGroup === 'function') {
                markerClusterGroup = L.markerClusterGroup({
                    chunkedLoading: true,
                    spiderfyOnMaxZoom: true,
                    showCoverageOnHover: false,
                    zoomToBoundsOnClick: true,
                    maxClusterRadius: 45
                });
            } else {
                markerClusterGroup = L.layerGroup();
            }
            map.addLayer(markerClusterGroup);
        }

        function detectBrand(storeName) {
            const name = storeName ? storeName.toUpperCase() : "";
            if (name.includes("GS25") || name.includes("지에스") || name.includes("GS 25")) return "GS25";
            if (name.includes("CU") || name.includes("씨유")) return "CU";
            if (name.includes("세븐일레븐") || name.includes("SEVEN") || name.includes("7-ELEVEN")) return "세븐일레븐";
            if (name.includes("이마트24") || name.includes("EMART24") || name.includes("이마트 24")) return "이마트24";
            if (name.includes("미니스톱") || name.includes("MINISTOP")) return "미니스톱";
            return "기타";
        }

        function createBrandSvgMarker(brand) {
            const colors = BRAND_COLORS[brand] || BRAND_COLORS["기타"];
            const svgHtml = `
                <svg width="30" height="42" viewBox="0 0 30 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 0C6.71573 0 0 6.71573 0 15C0 26.25 15 42 15 42C15 42 30 26.25 30 15C30 6.71573 23.2843 0 15 0Z" fill="${colors.bg}" stroke="${colors.border}" stroke-width="2"/>
                    <circle cx="15" cy="15" r="7.5" fill="white"/>
                    <circle cx="15" cy="15" r="4" fill="${colors.bg}"/>
                </svg>
            `;
            return L.divIcon({
                html: svgHtml,
                className: '',
                iconSize: [30, 42],
                iconAnchor: [15, 42],
                popupAnchor: [0, -38]
            });
        }

        function populateDistrictAndDongFilters() {
            const districtSelect = document.getElementById('districtFilter');
            const districts = new Set();
            
            storesData.forEach(s => {
                if (s.district) districts.add(s.district);
            });

            const sortedDistricts = Array.from(districts).sort();
            districtSelect.innerHTML = '<option value="ALL">전체 구/군 (부산시)</option>';
            sortedDistricts.forEach(dist => {
                const opt = document.createElement('option');
                opt.value = dist;
                opt.textContent = dist;
                districtSelect.appendChild(opt);
            });

            updateDongFilter();
        }

        function updateDongFilter() {
            const dongSelect = document.getElementById('dongFilter');
            const selectedDistrict = document.getElementById('districtFilter').value;
            const dongs = new Set();

            storesData.forEach(s => {
                if ((selectedDistrict === 'ALL' || s.district === selectedDistrict) && s.dong) {
                    dongs.add(s.dong);
                }
            });

            const sortedDongs = Array.from(dongs).sort();
            dongSelect.innerHTML = '<option value="ALL">전체 동</option>';
            sortedDongs.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                dongSelect.appendChild(opt);
            });
        }

        function initBrandFilters() {
            const container = document.getElementById('brandFilterContainer');
            container.innerHTML = '';
            
            const allBrands = ["GS25", "CU", "세븐일레븐", "이마트24", "미니스톱", "기타"];

            allBrands.forEach(brand => {
                const count = storesData.filter(s => s.brand === brand).length;
                selectedBrands.add(brand); // Default select all

                const btn = document.createElement('button');
                btn.className = `brand-pill px-2.5 py-1 text-[11px] rounded-lg border font-bold flex items-center gap-1 transition ${getBrandBadgeStyle(brand, true)}`;
                btn.dataset.brand = brand;
                btn.innerHTML = `<span>${brand}</span> <span class="text-[9px] opacity-80">(${count})</span>`;
                
                btn.addEventListener('click', () => {
                    if (selectedBrands.has(brand)) {
                        selectedBrands.delete(brand);
                        btn.className = `brand-pill px-2.5 py-1 text-[11px] rounded-lg border font-medium flex items-center gap-1 transition bg-slate-100 text-slate-400 border-slate-200`;
                    } else {
                        selectedBrands.add(brand);
                        btn.className = `brand-pill px-2.5 py-1 text-[11px] rounded-lg border font-bold flex items-center gap-1 transition ${getBrandBadgeStyle(brand, true)}`;
                    }
                    applyFilters();
                });

                container.appendChild(btn);
            });
        }

        function getBrandBadgeStyle(brand, active) {
            if (!active) return "bg-slate-100 text-slate-400 border-slate-200";
            switch(brand) {
                case "GS25": return "bg-blue-600 text-white border-blue-700 shadow-xs";
                case "CU": return "bg-purple-600 text-white border-purple-700 shadow-xs";
                case "세븐일레븐": return "bg-emerald-600 text-white border-emerald-700 shadow-xs";
                case "이마트24": return "bg-amber-500 text-slate-900 border-amber-600 shadow-xs";
                case "미니스톱": return "bg-blue-800 text-white border-blue-900 shadow-xs";
                default: return "bg-slate-600 text-white border-slate-700 shadow-xs";
            }
        }

        function applyFilters() {
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const selectedDistrict = document.getElementById('districtFilter').value;
            const selectedDong = document.getElementById('dongFilter').value;

            filteredStores = storesData.filter(store => {
                // Brand filter
                if (!selectedBrands.has(store.brand)) return false;

                // District filter
                if (selectedDistrict !== 'ALL' && store.district !== selectedDistrict) return false;

                // Dong filter
                if (selectedDong !== 'ALL' && store.dong !== selectedDong) return false;

                // Keyword search
                if (searchKeyword) {
                    const fullText = `${store.name} ${store.branch} ${store.address} ${store.district} ${store.dong}`.toLowerCase();
                    if (!fullText.includes(searchKeyword)) return false;
                }

                return true;
            });

            updateUI();
        }

        function focusStoreOnMap(storeId) {
            const store = storesData.find(s => s.id === storeId);

            map.setView([store.lat, store.lng], 17, { animate: true, duration: 1 });
            
            const marker = markersMap.get(storeId);
            if (marker) {
                if (typeof markerClusterGroup.zoomToShowLayer === 'function') {
                    markerClusterGroup.zoomToShowLayer(marker, () => {
                        marker.openPopup();
                    });
                } else {
                    marker.openPopup();
                }
            }

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function updateCharts() {
            if (!brandChartInstance || !districtChartInstance) return;

            const brandCounts = {};
            filteredStores.forEach(s => {
                brandCounts[s.brand] = (brandCounts[s.brand] || 0) + 1;
            });

            const brandLabels = Object.keys(brandCounts);
            const brandData = Object.values(brandCounts);
            const brandColors = brandLabels.map(b => (BRAND_COLORS[b] ? BRAND_COLORS[b].bg : '#64748b'));

            brandChartInstance.data.labels = brandLabels;
            brandChartInstance.data.datasets[0].data = brandData;
            brandChartInstance.data.datasets[0].backgroundColor = brandColors;
            brandChartInstance.update();

            const districtCounts = {};
            filteredStores.forEach(s => {
                const dist = s.district || '기타';
                districtCounts[dist] = (districtCounts[dist] || 0) + 1;
            });

            const sortedDistricts = Object.entries(districtCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            districtChartInstance.data.labels = sortedDistricts.map(item => item[0]);
            districtChartInstance.data.datasets[0].data = sortedDistricts.map(item => item[1]);
            districtChartInstance.update();
        }

        function parseCSVFile(file) {
            showToast("CSV 파일을 구동하는 중입니다...", "info");

            // PapaParse reading with auto encoding fallback (EUC-KR for Korean public portals)
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                encoding: "EUC-KR",
                complete: function(results) {
                    const firstRow = results.data[0];
                    if (!firstRow || Object.keys(firstRow).some(k => k.includes(''))) {
                        Papa.parse(file, {
                            header: true,
                            skipEmptyLines: true,
                            encoding: "UTF-8",
                            complete: function(utfResults) {
                                processParsedCSV(utfResults.data, file.name);
                            }
                        });
                    } else {
                        processParsedCSV(results.data, file.name);
                    }
                },
                error: function(err) {
                    showToast("CSV 파싱 실패: " + err.message, "error");
                }
            });
        }

        function processParsedCSV(data, fileName) {
            if (!data || data.length === 0) {
                showToast("CSV 파일에 유효한 데이터가 없습니다.", "error");
                return;
            }

            const parsedStores = [];
            let idCounter = 1;

            data.forEach(row => {
                const keys = Object.keys(row);
                
                const nameKey = keys.find(k => k.includes("상호명") || k.includes("상호") || k.includes("점포명") || k.includes("name"));
                const branchKey = keys.find(k => k.includes("지점명") || k.includes("지점"));
                const addressKey = keys.find(k => k.includes("도로명주소") || k.includes("주소") || k.includes("address"));
                const districtKey = keys.find(k => k.includes("시군구명") || k.includes("구명") || k.includes("시군구"));
                const dongKey = keys.find(k => k.includes("법정동명") || k.includes("행정동명") || k.includes("동명"));
                
                const latKey = keys.find(k => k.includes("위도") || k.includes("lat") || k.includes("Latitude") || k.includes("Y"));
                const lngKey = keys.find(k => k.includes("경도") || k.includes("lon") || k.includes("lng") || k.includes("Longitude") || k.includes("X"));

                const storeName = row[nameKey] || "편의점";
                const branchName = row[branchKey] || "";
                const rawAddress = row[addressKey] || "";
                
                let lat = parseFloat(row[latKey]);
                let lng = parseFloat(row[lngKey]);

                // Swap lat/lng if inverted
                if (lat > 100 && lng < 50) {
                    const temp = lat;
                    lat = lng;
                    lng = temp;
                }

                if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) {
                    lat = 35.179558 + (Math.random() - 0.5) * 0.12;
                    lng = 129.075642 + (Math.random() - 0.5) * 0.12;
                }

                let district = row[districtKey] || "";
                if (!district && rawAddress) {
                    const match = rawAddress.match(/(해운대구|부산진구|수영구|남구|동래구|금정구|사상구|사하구|연제구|중구|서구|동구|영도구|북구|강서구|기장군)/);
                    if (match) district = match[1];
                }

                const brand = detectBrand(storeName);

                parsedStores.push({
                    id: idCounter++,
                    name: storeName,
                    branch: branchName,
                    district: district || "기타구",
                    dong: row[dongKey] || "",
                    address: rawAddress || "주소 정보 없음",
                    lat: lat,
                    lng: lng,
                    brand: brand
                });
            });

            if (parsedStores.length > 0) {
                storesData = parsedStores;
                populateDistrictAndDongFilters();
                initBrandFilters();
                applyFilters();

                const bounds = L.latLngBounds(parsedStores.map(s => [s.lat, s.lng]));
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [40, 40] });
                }

                showToast(`${parsedStores.length.toLocaleString()}개 점포 불러오기 성공 (${fileName})`, "success");
            } else {
                showToast("유효한 좌표 또는 상가 데이터를 파싱하지 못했습니다.", "error");
            }
        }

        function exportToCSV() {
            if (filteredStores.length === 0) {
                showToast("내보낼 데이터가 없습니다.", "error");
                return;
            }

            const exportData = filteredStores.map(s => ({
                "상호명": s.name,
                "지점명": s.branch,
                "브랜드": s.brand,
                "시군구": s.district,
                "법정동": s.dong,
                "도로명주소": s.address,
                "위도": s.lat,
                "경도": s.lng
            }));

            const csvStr = Papa.unparse(exportData);
            const blob = new Blob(["\ufeff" + csvStr], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", `부산상가_편의점_조회결과_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("CSV 내보내기가 완료되었습니다.", "success");
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            searchInput.addEventListener('input', (e) => {
                if (e.target.value) {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                applyFilters();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                applyFilters();
            });

            document.getElementById('districtFilter').addEventListener('change', () => {
                updateDongFilter();
                applyFilters();
            });
            document.getElementById('dongFilter').addEventListener('change', applyFilters);

            document.getElementById('selectAllBrandsBtn').addEventListener('click', () => {
                const allBrands = ["GS25", "CU", "세븐일레븐", "이마트24", "미니스톱", "기타"];
                allBrands.forEach(b => selectedBrands.add(b));
                initBrandFilters();
                applyFilters();
            });

            // Tab Navigation
            const tabListBtn = document.getElementById('tabListBtn');
            const tabStatsBtn = document.getElementById('tabStatsBtn');
            const tabListContent = document.getElementById('tabListContent');
            const tabStatsContent = document.getElementById('tabStatsContent');

            tabListBtn.addEventListener('click', () => {
                tabListBtn.className = "flex-1 py-2.5 px-3 border-b-2 border-blue-600 text-blue-600 font-bold flex items-center justify-center gap-1.5";
                tabStatsBtn.className = "flex-1 py-2.5 px-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5";
                tabListContent.classList.remove('hidden');
                tabStatsContent.classList.add('hidden');
            });

            tabStatsBtn.addEventListener('click', () => {
                tabStatsBtn.className = "flex-1 py-2.5 px-3 border-b-2 border-blue-600 text-blue-600 font-bold flex items-center justify-center gap-1.5";
                tabListBtn.className = "flex-1 py-2.5 px-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5";
                tabStatsContent.classList.remove('hidden');
                tabListContent.classList.add('hidden');
                updateCharts();
            });

            document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
            });

            document.getElementById('recenterBtn').addEventListener('click', () => {
                if (filteredStores.length > 0) {
                    const bounds = L.latLngBounds(filteredStores.filter(s => s.lat && s.lng).map(s => [s.lat, s.lng]));
                    if (bounds.isValid()) {
                        map.fitBounds(bounds, { padding: [30, 30] });
                    }
                } else {
                    map.setView([35.179558, 129.075642], 12);
                }
            });

            document.getElementById('myLocationBtn').addEventListener('click', () => {
                if (navigator.geolocation) {
                    showToast("현재 위치를 측정 중입니다...", "info");
                    navigator.geolocation.getCurrentPosition((pos) => {
                        const { latitude, longitude } = pos.coords;
                        map.setView([latitude, longitude], 15);
                        
                        if (myLocationMarker) map.removeLayer(myLocationMarker);
                        
                        myLocationMarker = L.circleMarker([latitude, longitude], {
                            radius: 9,
                            fillColor: '#3b82f6',
                            color: '#ffffff',
                            weight: 3,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup("현재 사용자의 위치").openPopup();

                        showToast("현재 위치로 이동했습니다.", "success");
                    }, (err) => {
                        showToast("위치 정보를 가져올 수 없습니다.", "error");
                    });
                } else {
                    showToast("브라우저가 위치 정보를 지원하지 않습니다.", "error");
                }
            });

            document.getElementById('closeModalBtn').addEventListener('click', () => {
                document.getElementById('detailModal').classList.add('hidden');
            });

            document.getElementById('exportCsvBtn').addEventListener('click', exportToCSV);

            document.getElementById('resetDataBtn').addEventListener('click', () => {
                storesData = [...DEFAULT_BUSAN_STORES];
                populateDistrictAndDongFilters();
                initBrandFilters();
                applyFilters();
                showToast("기본 부산 편의점 데이터로 복원되었습니다.", "success");
            });

            document.getElementById('csvFileInput').addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    parseCSVFile(e.target.files[0]);
                }
            });

            // Drag and Drop CSV file
            window.addEventListener('dragover', (e) => {
                e.preventDefault();
                document.body.classList.add('drag-over');
            });
            window.addEventListener('dragleave', (e) => {
                if (e.clientX <= 0 || e.clientY <= 0) {
                    document.body.classList.remove('drag-over');
                }
            });
            window.addEventListener('drop', (e) => {
                e.preventDefault();
                document.body.classList.remove('drag-over');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    parseCSVFile(e.dataTransfer.files[0]);
                }
            });
        }

        function showToast(message, type = "info") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;

            if (type === "success") {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            } else if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-lg";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-blue-400 text-lg";
            }

            toast.classList.remove('hidden', 'translate-y-2');
            
            setTimeout(() => {
                toast.classList.add('hidden', 'translate-y-2');
            }, 3500);
        }
    </script>
</body>
</html>
